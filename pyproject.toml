[project]
name = "daily-companion"
version = "0.1.0"
description = "Personal diary and daily assistant powered by Claude Code (headless)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "tzdata>=2026.3",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companion"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
